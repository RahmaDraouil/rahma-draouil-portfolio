<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="hederaFoundGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1593D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B8A88;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="300" height="300" rx="20" fill="url(#hederaFoundGrad)"/>
  
  <!-- Consensus visualization -->
  <g transform="translate(150, 100)">
    <!-- Central node -->
    <circle cx="0" cy="0" r="20" fill="white" opacity="0.9"/>
    <text x="0" y="6" font-family="Arial" font-size="16" fill="#1593D0" text-anchor="middle" font-weight="bold">C</text>
    
    <!-- Ring 1 -->
    <circle cx="0" cy="-50" r="12" fill="white" opacity="0.8"/>
    <circle cx="43" cy="-25" r="12" fill="white" opacity="0.8"/>
    <circle cx="43" cy="25" r="12" fill="white" opacity="0.8"/>
    <circle cx="0" cy="50" r="12" fill="white" opacity="0.8"/>
    <circle cx="-43" cy="25" r="12" fill="white" opacity="0.8"/>
    <circle cx="-43" cy="-25" r="12" fill="white" opacity="0.8"/>
    
    <!-- Connections to center -->
    <line x1="0" y1="-20" x2="0" y2="-38" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="17" y1="-10" x2="31" y2="-19" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="17" y1="10" x2="31" y2="19" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="20" x2="0" y2="38" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="-17" y1="10" x2="-31" y2="19" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="-17" y1="-10" x2="-31" y2="-19" stroke="white" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Transaction blocks -->
  <g transform="translate(50, 180)">
    <rect x="0" y="0" width="30" height="30" rx="3" fill="white" opacity="0.7"/>
    <rect x="35" y="0" width="30" height="30" rx="3" fill="white" opacity="0.7"/>
    <rect x="70" y="0" width="30" height="30" rx="3" fill="white" opacity="0.7"/>
    <path d="M 30 15 L 35 15 M 65 15 L 70 15" stroke="white" stroke-width="3" opacity="0.9"/>
  </g>
  
  <!-- Text -->
  <text x="150" y="235" font-family="Arial" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Hedera Certified</text>
  <text x="150" y="255" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Foundations</text>
  <text x="150" y="280" font-family="Arial" font-size="10" fill="white" text-anchor="middle" opacity="0.8">Illustration personnalisée</text>
</svg>
