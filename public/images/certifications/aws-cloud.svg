<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="awsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1593D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#17324D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="300" height="300" rx="20" fill="url(#awsGrad)"/>
  
  <!-- Cloud illustration -->
  <g transform="translate(150, 100)">
    <ellipse cx="0" cy="0" rx="60" ry="35" fill="white" opacity="0.9"/>
    <ellipse cx="-35" cy="0" rx="40" ry="25" fill="white" opacity="0.9"/>
    <ellipse cx="35" cy="0" rx="40" ry="25" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Server racks -->
  <g transform="translate(90, 160)">
    <rect x="0" y="0" width="30" height="50" rx="3" fill="white" opacity="0.8"/>
    <rect x="5" y="5" width="20" height="8" rx="2" fill="#1593D0"/>
    <rect x="5" y="18" width="20" height="8" rx="2" fill="#1593D0"/>
    <rect x="5" y="31" width="20" height="8" rx="2" fill="#1593D0"/>
  </g>
  
  <g transform="translate(135, 160)">
    <rect x="0" y="0" width="30" height="50" rx="3" fill="white" opacity="0.8"/>
    <rect x="5" y="5" width="20" height="8" rx="2" fill="#1B8A88"/>
    <rect x="5" y="18" width="20" height="8" rx="2" fill="#1B8A88"/>
    <rect x="5" y="31" width="20" height="8" rx="2" fill="#1B8A88"/>
  </g>
  
  <g transform="translate(180, 160)">
    <rect x="0" y="0" width="30" height="50" rx="3" fill="white" opacity="0.8"/>
    <rect x="5" y="5" width="20" height="8" rx="2" fill="#1593D0"/>
    <rect x="5" y="18" width="20" height="8" rx="2" fill="#1593D0"/>
    <rect x="5" y="31" width="20" height="8" rx="2" fill="#1593D0"/>
  </g>
  
  <!-- Text -->
  <text x="150" y="240" font-family="Arial" font-size="18" fill="white" text-anchor="middle" font-weight="bold">AWS Cloud</text>
  <text x="150" y="260" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Foundations</text>
  <text x="150" y="280" font-family="Arial" font-size="10" fill="white" text-anchor="middle" opacity="0.8">Illustration personnalisée</text>
</svg>
