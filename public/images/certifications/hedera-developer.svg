<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="hederaDevGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B8A88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#17324D;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="300" height="300" rx="20" fill="url(#hederaDevGrad)"/>
  
  <!-- Network nodes -->
  <g transform="translate(150, 120)">
    <circle cx="0" cy="-40" r="15" fill="white" opacity="0.9"/>
    <circle cx="-35" cy="-20" r="15" fill="white" opacity="0.9"/>
    <circle cx="35" cy="-20" r="15" fill="white" opacity="0.9"/>
    <circle cx="-35" cy="20" r="15" fill="white" opacity="0.9"/>
    <circle cx="35" cy="20" r="15" fill="white" opacity="0.9"/>
    <circle cx="0" cy="40" r="15" fill="white" opacity="0.9"/>
    
    <!-- Connections -->
    <line x1="0" y1="-40" x2="-35" y2="-20" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-40" x2="35" y2="-20" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="-35" y1="-20" x2="-35" y2="20" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="35" y1="-20" x2="35" y2="20" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="-35" y1="20" x2="0" y2="40" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="35" y1="20" x2="0" y2="40" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="-35" y1="-20" x2="35" y2="-20" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="-35" y1="20" x2="35" y2="20" stroke="white" stroke-width="2" opacity="0.6"/>
  </g>
  
  <!-- Code brackets -->
  <g transform="translate(80, 190)" fill="white" opacity="0.7">
    <text font-family="monospace" font-size="30">{'<'}</text>
  </g>
  <g transform="translate(200, 190)" fill="white" opacity="0.7">
    <text font-family="monospace" font-size="30">{'/>'}</text>
  </g>
  
  <!-- Text -->
  <text x="150" y="230" font-family="Arial" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Hedera Certified</text>
  <text x="150" y="250" font-family="Arial" font-size="14" fill="white" text-anchor="middle">Developer Associate</text>
  <text x="150" y="280" font-family="Arial" font-size="10" fill="white" text-anchor="middle" opacity="0.8">Illustration personnalisée</text>
</svg>
