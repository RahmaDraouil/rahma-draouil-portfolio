<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1593D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B8A88;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="#17324D"/>
  
  <!-- Grid -->
  <g stroke="#1593D0" stroke-width="0.5" opacity="0.2">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>
  
  <!-- ECG Signal -->
  <path d="M 50 250 L 100 250 L 120 230 L 130 250 L 140 100 L 150 350 L 160 250 L 180 240 L 200 250 
           L 250 250 L 270 230 L 280 250 L 290 100 L 300 350 L 310 250 L 330 240 L 350 250
           L 400 250 L 420 230 L 430 250 L 440 100 L 450 350 L 460 250 L 480 240 L 500 250
           L 550 250 L 570 230 L 580 250 L 590 100 L 600 350 L 610 250 L 630 240 L 650 250
           L 700 250 L 720 230 L 730 250 L 740 100 L 750 350" 
        stroke="#1B8A88" stroke-width="3" fill="none"/>
  
  <!-- Interface panel -->
  <rect x="50" y="50" width="200" height="120" rx="10" fill="url(#ecgGrad)" opacity="0.9"/>
  <text x="150" y="85" font-family="Arial" font-size="16" fill="white" text-anchor="middle" font-weight="bold">Classification</text>
  <text x="70" y="110" font-family="Arial" font-size="14" fill="white">Normal: 78%</text>
  <text x="70" y="135" font-family="Arial" font-size="14" fill="white">Anomalie: 22%</text>
  <circle cx="230" cy="105" r="6" fill="#4ade80"/>
  <circle cx="230" cy="130" r="6" fill="#f87171"/>
  
  <!-- Neural network visualization -->
  <g transform="translate(600, 80)">
    <circle cx="0" cy="0" r="8" fill="#1593D0" opacity="0.8"/>
    <circle cx="0" cy="30" r="8" fill="#1593D0" opacity="0.8"/>
    <circle cx="0" cy="60" r="8" fill="#1593D0" opacity="0.8"/>
    <circle cx="50" cy="15" r="8" fill="#1B8A88" opacity="0.8"/>
    <circle cx="50" cy="45" r="8" fill="#1B8A88" opacity="0.8"/>
    <circle cx="100" cy="30" r="8" fill="#17324D" opacity="0.8"/>
    <line x1="8" y1="0" x2="42" y2="15" stroke="#1593D0" stroke-width="1.5" opacity="0.4"/>
    <line x1="8" y1="30" x2="42" y2="15" stroke="#1593D0" stroke-width="1.5" opacity="0.4"/>
    <line x1="8" y1="30" x2="42" y2="45" stroke="#1593D0" stroke-width="1.5" opacity="0.4"/>
    <line x1="8" y1="60" x2="42" y2="45" stroke="#1593D0" stroke-width="1.5" opacity="0.4"/>
    <line x1="58" y1="15" x2="92" y2="30" stroke="#1B8A88" stroke-width="1.5" opacity="0.4"/>
    <line x1="58" y1="45" x2="92" y2="30" stroke="#1B8A88" stroke-width="1.5" opacity="0.4"/>
  </g>
  
  <!-- Data visualization -->
  <g transform="translate(550, 350)">
    <rect x="0" y="0" width="200" height="100" rx="8" fill="#1593D0" opacity="0.2"/>
    <rect x="10" y="70" width="30" height="20" fill="#1B8A88"/>
    <rect x="50" y="50" width="30" height="40" fill="#1B8A88"/>
    <rect x="90" y="40" width="30" height="50" fill="#1B8A88"/>
    <rect x="130" y="30" width="30" height="60" fill="#1B8A88"/>
    <text x="100" y="20" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle">Précision</text>
  </g>
</svg>
