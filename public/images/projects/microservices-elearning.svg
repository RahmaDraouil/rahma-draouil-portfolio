<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="msGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1593D0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#17324D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="msGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B8A88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1593D0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" fill="#F7FAFC"/>
  
  <!-- Central API Gateway -->
  <rect x="350" y="200" width="100" height="100" rx="10" fill="url(#msGrad1)"/>
  <text x="400" y="240" font-family="Arial" font-size="14" fill="white" text-anchor="middle" font-weight="bold">API</text>
  <text x="400" y="260" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Gateway</text>
  
  <!-- Microservices -->
  <g id="service1" transform="translate(150, 80)">
    <rect x="0" y="0" width="90" height="80" rx="8" fill="url(#msGrad2)"/>
    <text x="45" y="30" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Utilisateurs</text>
    <circle cx="20" cy="55" r="5" fill="white" opacity="0.7"/>
    <circle cx="45" cy="55" r="5" fill="white" opacity="0.7"/>
    <circle cx="70" cy="55" r="5" fill="white" opacity="0.7"/>
  </g>
  
  <g id="service2" transform="translate(560, 80)">
    <rect x="0" y="0" width="90" height="80" rx="8" fill="url(#msGrad2)"/>
    <text x="45" y="30" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Cours</text>
    <rect x="15" y="45" width="60" height="6" rx="2" fill="white" opacity="0.7"/>
    <rect x="15" y="55" width="60" height="6" rx="2" fill="white" opacity="0.7"/>
    <rect x="15" y="65" width="40" height="6" rx="2" fill="white" opacity="0.7"/>
  </g>
  
  <g id="service3" transform="translate(150, 320)">
    <rect x="0" y="0" width="90" height="80" rx="8" fill="url(#msGrad2)"/>
    <text x="45" y="30" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Événements</text>
    <circle cx="45" cy="55" r="12" fill="white" opacity="0.7"/>
    <text x="45" y="60" font-family="Arial" font-size="10" fill="#1593D0" text-anchor="middle">📅</text>
  </g>
  
  <g id="service4" transform="translate(560, 320)">
    <rect x="0" y="0" width="90" height="80" rx="8" fill="url(#msGrad2)"/>
    <text x="45" y="30" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Clubs</text>
    <circle cx="45" cy="55" r="12" fill="white" opacity="0.7"/>
    <text x="45" y="60" font-family="Arial" font-size="10" fill="#1593D0" text-anchor="middle">👥</text>
  </g>
  
  <!-- Connection lines -->
  <line x1="240" y1="120" x2="350" y2="220" stroke="#1593D0" stroke-width="2" opacity="0.6"/>
  <line x1="560" y1="120" x2="450" y2="220" stroke="#1593D0" stroke-width="2" opacity="0.6"/>
  <line x1="240" y1="360" x2="350" y2="280" stroke="#1593D0" stroke-width="2" opacity="0.6"/>
  <line x1="560" y1="360" x2="450" y2="280" stroke="#1593D0" stroke-width="2" opacity="0.6"/>
  
  <!-- Kubernetes orchestration -->
  <g transform="translate(30, 200)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#17324D" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="0" y="5" font-family="Arial" font-size="12" fill="#17324D" text-anchor="middle" font-weight="bold">K8s</text>
  </g>
  
  <!-- CI/CD Pipeline -->
  <g transform="translate(680, 200)">
    <rect x="0" y="0" width="80" height="100" rx="8" fill="#17324D" opacity="0.8"/>
    <text x="40" y="25" font-family="Arial" font-size="11" fill="white" text-anchor="middle">CI/CD</text>
    <rect x="10" y="35" width="60" height="15" rx="3" fill="#1B8A88"/>
    <rect x="10" y="55" width="60" height="15" rx="3" fill="#1B8A88"/>
    <rect x="10" y="75" width="60" height="15" rx="3" fill="#1B8A88"/>
    <text x="40" y="46" font-family="Arial" font-size="8" fill="white" text-anchor="middle">Build</text>
    <text x="40" y="66" font-family="Arial" font-size="8" fill="white" text-anchor="middle">Test</text>
    <text x="40" y="86" font-family="Arial" font-size="8" fill="white" text-anchor="middle">Deploy</text>
  </g>
  
  <!-- Monitoring -->
  <g transform="translate(350, 50)">
    <rect x="0" y="0" width="100" height="40" rx="5" fill="#1B8A88" opacity="0.7"/>
    <text x="50" y="25" font-family="Arial" font-size="11" fill="white" text-anchor="middle">Monitoring</text>
  </g>
  <line x1="400" y1="90" x2="400" y2="200" stroke="#1B8A88" stroke-width="2" stroke-dasharray="3,3" opacity="0.5"/>
  
  <!-- AI Recommendation -->
  <g transform="translate(350, 350)">
    <rect x="0" y="0" width="100" height="50" rx="5" fill="#17324D" opacity="0.8"/>
    <text x="50" y="20" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Recommandations</text>
    <text x="50" y="35" font-family="Arial" font-size="10" fill="white" text-anchor="middle">IA</text>
  </g>
  <line x1="400" y1="300" x2="400" y2="350" stroke="#17324D" stroke-width="2" stroke-dasharray="3,3" opacity="0.5"/>
</svg>
